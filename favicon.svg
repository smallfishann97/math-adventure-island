<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="數學遊戲冒險島 App Logo">
  <defs>
    <clipPath id="appCardClip">
      <rect x="6" y="6" width="116" height="116" rx="28" ry="28"/>
    </clipPath>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="62%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFD066"/>
    </linearGradient>
    <linearGradient id="seaMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EE0B5"/>
      <stop offset="100%" stop-color="#45B889"/>
    </linearGradient>
    <linearGradient id="islandGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BE564"/>
      <stop offset="100%" stop-color="#53B85A"/>
    </linearGradient>
    <linearGradient id="islandRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5BA62"/>
      <stop offset="100%" stop-color="#D68635"/>
    </linearGradient>
    <linearGradient id="roofCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7F6B"/>
      <stop offset="100%" stop-color="#E85342"/>
    </linearGradient>
  </defs>

  <!-- 圓角主體內容區 -->
  <g clip-path="url(#appCardClip)">
    <!-- 溫暖陽光奶油黃背景 -->
    <rect x="6" y="6" width="116" height="116" fill="url(#bgWarm)"/>

    <!-- 上方柔和亮光弧線（增加精品 App 玻璃光澤） -->
    <ellipse cx="64" cy="14" rx="58" ry="22" fill="#FFFDF2" opacity="0.55"/>

    <!-- 底部薄荷綠微笑海面（粗黑框線） -->
    <path d="M 4 94 Q 34 86 64 93 T 124 92 L 124 124 L 4 124 Z" fill="url(#seaMint)" stroke="#1E1B18" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 22 108 Q 36 104 50 108 M 78 109 Q 92 105 106 109" fill="none" stroke="#E8FFF5" stroke-width="3.6" stroke-linecap="round"/>

    <!-- 左上角＆右上角簡潔粗黑框數學符號徽章（＋、×） -->
    <g transform="translate(27, 29)">
      <circle cx="0" cy="0" r="12" fill="#FFFDF7" stroke="#1E1B18" stroke-width="4"/>
      <path d="M -5 0 H 5 M 0 -5 V 5" stroke="#E85342" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(101, 29)">
      <circle cx="0" cy="0" r="12" fill="#FFFDF7" stroke="#1E1B18" stroke-width="4"/>
      <path d="M -4.2 -4.2 L 4.2 4.2 M 4.2 -4.2 L -4.2 4.2" stroke="#E58B17" stroke-width="3.6" stroke-linecap="round"/>
    </g>

    <!-- 圓潤浮空島暖金底座（粗黑框） -->
    <path d="M 24 81 C 24 97 42 105 64 105 C 86 105 104 97 104 81 C 92 87 36 87 24 81 Z" fill="url(#islandRock)" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round"/>

    <!-- 超 Q 圓胖抹茶草坡小島（粗黑框） -->
    <path d="M 21 80 C 21 53 40 44 64 44 C 88 44 107 53 107 80 C 93 88 35 88 21 80 Z" fill="url(#islandGrass)" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round"/>
    <!-- 草坡高光 -->
    <ellipse cx="43" cy="56" rx="9" ry="4.2" transform="rotate(-18 43 56)" fill="#D8F9B8" opacity="0.8"/>

    <!-- 島嶼可愛水汪汪大眼睛 + 粉嫩腮紅 + 開心貓嘴 -->
    <circle cx="49" cy="70" r="5.2" fill="#1E1B18"/>
    <circle cx="50.8" cy="68.2" r="2" fill="#FFFFFF"/>
    <circle cx="79" cy="70" r="5.2" fill="#1E1B18"/>
    <circle cx="80.8" cy="68.2" r="2" fill="#FFFFFF"/>
    <ellipse cx="38" cy="75.5" rx="6.2" ry="3.8" fill="#FF8599" opacity="0.9"/>
    <ellipse cx="90" cy="75.5" rx="6.2" ry="3.8" fill="#FF8599" opacity="0.9"/>
    <path d="M 58 73.5 Q 61 78.2 64 74.8 Q 67 78.2 70 73.5" fill="none" stroke="#1E1B18" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 島頂超可愛粗黑框草莓紅小屋 -->
    <rect x="49" y="30" width="30" height="20" rx="6" fill="#FFFDF5" stroke="#1E1B18" stroke-width="4.5"/>
    <path d="M 43 34 C 48 18 80 18 85 34 Z" fill="url(#roofCoral)" stroke="#1E1B18" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="59" y="37" width="10" height="13" rx="4" fill="#D4844A" stroke="#1E1B18" stroke-width="3.4"/>
    <circle cx="64" cy="27.5" r="3.4" fill="#FFE055" stroke="#1E1B18" stroke-width="2.4"/>

    <!-- 屋頂閃耀小金星 -->
    <path d="M 64 10 L 66.2 15.2 L 71.8 15.8 L 67.6 19.4 L 68.8 24.8 L 64 22 L 59.2 24.8 L 60.4 19.4 L 56.2 15.8 L 61.8 15.2 Z" fill="#FFD54F" stroke="#1E1B18" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- 內層柔和白色反光細框 -->
  <rect x="10.5" y="10.5" width="107" height="107" rx="23.5" ry="23.5" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>

  <!-- 最外層醒目「粗黑框 + 大圓角」App 外框 -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="none" stroke="#1E1B18" stroke-width="7"/>
</svg>
