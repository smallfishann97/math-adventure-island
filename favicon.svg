<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="數學遊戲冒險島 Logo">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7DC"/>
      <stop offset="68%" stop-color="#FFEAB8"/>
      <stop offset="100%" stop-color="#BCECD9"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD9BE"/>
      <stop offset="100%" stop-color="#5EB99C"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BE07E"/>
      <stop offset="100%" stop-color="#5DAE52"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE09B"/>
      <stop offset="100%" stop-color="#E5AF56"/>
    </linearGradient>
  </defs>

  <!-- 圓角暖金外框 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skyGrad)" stroke="#E3A13E" stroke-width="3.2"/>

  <!-- 太陽與小雲朵 -->
  <circle cx="49" cy="14" r="6" fill="#FFD35A" stroke="#E59A28" stroke-width="1.4"/>
  <path d="M12 18 C12 15.6 14 14 16.2 14.3 C17 12.2 19.8 11.8 21.5 13.4 C23.5 13.3 25 14.8 25 16.8 C25 18.4 23.7 19.5 22 19.5 L14.5 19.5 C13 19.5 12 18.8 12 18 Z" fill="#FFFDF8" stroke="#E8C998" stroke-width="1"/>

  <!-- 底部薄荷海面與波紋 -->
  <path d="M4 44 Q18 40 32 43 T60 43 L60 47 Q60 60 47 60 L17 60 Q4 60 4 47 Z" fill="url(#seaGrad)"/>
  <path d="M11 52 Q18 50 25 52 M38 54 Q45 52 52 54" fill="none" stroke="#E7FFF5" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- 浮空冒險島沙灘底座 -->
  <ellipse cx="32" cy="44" rx="22" ry="7.2" fill="url(#sandGrad)" stroke="#7A5434" stroke-width="1.8"/>

  <!-- 抹茶綠草坡島面 -->
  <path d="M13 42 C15 31 23 27 32 27 C41 27 49 31 51 42 C45 45.2 19 45.2 13 42 Z" fill="url(#grassGrad)" stroke="#5A4031" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- 島上可愛小紅屋 -->
  <rect x="24" y="26" width="13" height="10.5" rx="2" fill="#FFFBF0" stroke="#5A4031" stroke-width="1.6"/>
  <path d="M21.5 27.2 L30.5 19.2 L39.5 27.2 Z" fill="#F07C67" stroke="#5A4031" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="28.5" y="30.5" width="4" height="6" rx="1.2" fill="#C47B46" stroke="#5A4031" stroke-width="1.2"/>
  <circle cx="30.5" cy="24.3" r="1.5" fill="#FFE074" stroke="#5A4031" stroke-width="0.9"/>

  <!-- 左側 Q 版小松樹 -->
  <rect x="17.5" y="31.5" width="2.8" height="6" rx="1" fill="#9A643B" stroke="#5A4031" stroke-width="1.1"/>
  <circle cx="18.9" cy="28.5" r="5" fill="#5CB860" stroke="#5A4031" stroke-width="1.5"/>
  <circle cx="17.4" cy="26.8" r="1.4" fill="#B6F0A3"/>

  <!-- 右側冒險小旗子 -->
  <line x1="44" y1="22" x2="44" y2="37.5" stroke="#5A4031" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M44.5 22.5 L53 25.5 L44.5 28.8 Z" fill="#FFCA4A" stroke="#5A4031" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- 閃亮星星點綴 -->
  <path d="M32 9 L33.1 11.7 L36 12.2 L33.8 14.1 L34.4 17 L32 15.5 L29.6 17 L30.2 14.1 L28 12.2 L30.9 11.7 Z" fill="#FFCF4A" stroke="#B6721A" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
