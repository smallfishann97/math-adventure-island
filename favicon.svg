<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="數學遊戲冒險島 Q版 Logo">
  <defs>
    <linearGradient id="qSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBE8"/>
      <stop offset="68%" stop-color="#FFEBBF"/>
      <stop offset="100%" stop-color="#C8F0DE"/>
    </linearGradient>
    <linearGradient id="qSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FDCC0"/>
      <stop offset="100%" stop-color="#55B594"/>
    </linearGradient>
    <linearGradient id="qIsland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8E882"/>
      <stop offset="100%" stop-color="#5DB862"/>
    </linearGradient>
    <linearGradient id="qBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="100%" stop-color="#E8B058"/>
    </linearGradient>
  </defs>

  <!-- 滿版零透明背景（徹底避免手機桌面 App 圖示四個角落出現黑底！） -->
  <rect x="0" y="0" width="64" height="64" fill="url(#qSky)"/>

  <!-- 底部薄荷奶綠海面與波紋（滿版延伸至底邊與左右邊緣） -->
  <path d="M0 46 Q16 42.5 32 45.5 T64 45.5 L64 64 L0 64 Z" fill="url(#qSea)"/>
  <path d="M11 55 Q18 53 25 55 M39 56 Q46 54 53 56" fill="none" stroke="#ECFFF7" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- 右上角微笑 Q 版小太陽 -->
  <circle cx="50" cy="14" r="6" fill="#FFD452" stroke="#D98B1E" stroke-width="1.6"/>
  <circle cx="48.2" cy="13.5" r="0.9" fill="#5A4031"/>
  <circle cx="51.8" cy="13.5" r="0.9" fill="#5A4031"/>
  <path d="M48.6 15.6 Q50 17 51.4 15.6" fill="none" stroke="#5A4031" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 左上角軟綿綿棉花糖雲朵 -->
  <path d="M9 17.5 C9 15 11.2 13.5 13.4 14 C14.4 11.6 17.6 11.4 19.2 13.2 C21.4 13 23 14.7 23 16.8 C23 18.4 21.6 19.5 19.8 19.5 L11.5 19.5 C10 19.5 9 18.7 9 17.5 Z" fill="#FFFDF8" stroke="#E5C48E" stroke-width="1.2"/>

  <!-- 圓滾滾浮空島暖金底座 -->
  <path d="M12 42 C12 49.5 21 53.5 32 53.5 C43 53.5 52 49.5 52 42 C46 45 18 45 12 42 Z" fill="url(#qBelly)" stroke="#6B482B" stroke-width="2" stroke-linejoin="round"/>

  <!-- 超 Q 圓胖抹茶草坡主體（帶可愛微笑臉蛋！） -->
  <path d="M11 41.5 C11 28.5 20.5 23.5 32 23.5 C43.5 23.5 53 28.5 53 41.5 C46.5 45.5 17.5 45.5 11 41.5 Z" fill="url(#qIsland)" stroke="#5A4031" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- 島嶼高光反光 -->
  <ellipse cx="22" cy="29" rx="4.5" ry="2.2" transform="rotate(-18 22 29)" fill="#D4F9B8" opacity="0.75"/>

  <!-- 島嶼超 Q 水汪汪大眼睛 + 粉嫩腮紅 + 貓咪笑嘴 -->
  <circle cx="24.5" cy="36.2" r="2.7" fill="#4A3224"/>
  <circle cx="25.3" cy="35.2" r="1.05" fill="#FFFFFF"/>
  <circle cx="39.5" cy="36.2" r="2.7" fill="#4A3224"/>
  <circle cx="40.3" cy="35.2" r="1.05" fill="#FFFFFF"/>
  <ellipse cx="19.5" cy="39.2" rx="3.1" ry="1.9" fill="#FF8FA3" opacity="0.88"/>
  <ellipse cx="44.5" cy="39.2" rx="3.1" ry="1.9" fill="#FF8FA3" opacity="0.88"/>
  <path d="M29.2 38.2 Q30.6 40.3 32 38.7 Q33.4 40.3 34.8 38.2" fill="none" stroke="#4A3224" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 頭頂迷你圓滾滾草莓紅小屋 -->
  <rect x="25.5" y="16.5" width="13" height="9.2" rx="3.2" fill="#FFFDF5" stroke="#5A4031" stroke-width="1.8"/>
  <path d="M23 18.2 C25 11.8 39 11.8 41 18.2 Z" fill="#F27868" stroke="#5A4031" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="29.8" y="20.2" width="4.4" height="5.5" rx="1.8" fill="#C97C46" stroke="#5A4031" stroke-width="1.3"/>
  <circle cx="32" cy="15.5" r="1.6" fill="#FFE066" stroke="#5A4031" stroke-width="0.9"/>

  <!-- 左邊圓球棒棒糖樹 -->
  <line x1="17.5" y1="22.5" x2="17.5" y2="27.5" stroke="#7A4F2C" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="17.5" cy="21" r="4.6" fill="#63C76A" stroke="#5A4031" stroke-width="1.6"/>
  <circle cx="16" cy="19.4" r="1.4" fill="#C9F7B8"/>

  <!-- 右邊閃耀小金星 -->
  <path d="M46.5 21.5 L47.9 24.4 L51 24.8 L48.7 27 L49.3 30.1 L46.5 28.6 L43.7 30.1 L44.3 27 L42 24.8 L45.1 24.4 Z" fill="#FFD24A" stroke="#9C5D12" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 頭頂閃亮星光 -->
  <path d="M32 4.8 L33.1 7.6 L36 8.1 L33.8 10 L34.4 12.8 L32 11.4 L29.6 12.8 L30.2 10 L28 8.1 L30.9 7.6 Z" fill="#FFD24A" stroke="#B56E16" stroke-width="1" stroke-linejoin="round"/>
</svg>
