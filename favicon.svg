<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="數學遊戲冒險島 App Logo">
  <defs>
    <clipPath id="kawaiiFrameClip">
      <rect x="7" y="7" width="114" height="114" rx="33" ry="33"/>
    </clipPath>
  </defs>

  <!-- 圓角主體內容區（乾淨手繪繪本平塗風，粗深棕框線） -->
  <g clip-path="url(#kawaiiFrameClip)">
    <!-- 溫暖奶油黃背景 -->
    <rect x="7" y="7" width="114" height="114" fill="#FFF6D6"/>

    <!-- 底部薄荷奶綠海面色塊＋粗深棕水平線 -->
    <rect x="4" y="95" width="120" height="30" fill="#78DE98"/>
    <line x1="4" y1="95" x2="124" y2="95" stroke="#533A2E" stroke-width="6"/>

    <!-- 島頂超萌粗框草莓橘小屋 -->
    <rect x="47" y="29" width="34" height="22" rx="5" fill="#FFFDF4" stroke="#533A2E" stroke-width="5.2" stroke-linejoin="round"/>
    <rect x="59.5" y="36.5" width="9" height="11" rx="3" fill="#FFD15C" stroke="#533A2E" stroke-width="2.8"/>
    <path d="M 41 33 C 46 16 82 16 87 33 Z" fill="#FF7B54" stroke="#533A2E" stroke-width="5.2" stroke-linejoin="round"/>

    <!-- 圓潤暖金島嶼底座（與草坡左右平滑銜接） -->
    <path d="M 22 77 C 22 96 40 105 64 105 C 88 105 106 96 106 77 Z" fill="#F8B454" stroke="#533A2E" stroke-width="5.8" stroke-linejoin="round"/>

    <!-- 圓滾滾抹茶草坡主體（粗深棕框） -->
    <path d="M 22 77 C 22 50 40 43 64 43 C 88 43 106 50 106 77 C 92 85 36 85 22 77 Z" fill="#88DF6B" stroke="#533A2E" stroke-width="5.8" stroke-linejoin="round"/>

    <!-- 水汪汪大眼睛 + 粉嫩橢圓腮紅 + 粗圓開心微笑 -->
    <circle cx="47" cy="66" r="5.8" fill="#533A2E"/>
    <circle cx="49" cy="63.8" r="2.1" fill="#FFFFFF"/>
    <circle cx="81" cy="66" r="5.8" fill="#533A2E"/>
    <circle cx="83" cy="63.8" r="2.1" fill="#FFFFFF"/>
    <ellipse cx="35.5" cy="73" rx="6.5" ry="4" fill="#FF88A4"/>
    <ellipse cx="92.5" cy="73" rx="6.5" ry="4" fill="#FF88A4"/>
    <path d="M 55.5 70.5 Q 64 79 72.5 70.5" fill="none" stroke="#533A2E" stroke-width="5.2" stroke-linecap="round"/>
  </g>

  <!-- 最外層超醒目「粗深棕黑框 + 大圓角」App 外框 -->
  <rect x="7" y="7" width="114" height="114" rx="33" ry="33" fill="none" stroke="#533A2E" stroke-width="9.5"/>
</svg>
